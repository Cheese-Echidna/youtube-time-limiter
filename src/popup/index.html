<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>YT Time Limiter</title>
        <link rel="stylesheet" href="./styles.css" />
        <script src="./main.js" defer></script>
    </head>
    <body>
        <main class="popup">
            <header class="panel hero">
                <p class="hero__eyebrow">Daily Quota</p>
                <h1 class="popup__title">YT Time Limiter</h1>
                <p id="output" class="popup__remaining">--:--:--</p>
                <p id="status-text" class="popup__status">Time remaining today</p>
            </header>

            <section class="panel panel--actions">
                <button id="export-csv" class="button button--secondary" type="button">Export history (CSV)</button>
            </section>

            <section class="panel">
                <div class="panel__header">
                    <h2 class="panel__title">Usage Trend</h2>
                    <p class="muted">Last 14 days</p>
                </div>
                <canvas id="history-chart" width="312" height="126"></canvas>
            </section>
        </main>
    </body>
</html>
