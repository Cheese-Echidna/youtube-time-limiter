<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>YT Time Limiter</title>
        <link rel="stylesheet" href="./styles.css" />
        <script src="./main.js" defer></script>
    </head>
    <body>
        <main class="popup">
            <h1 class="popup__title">YT Time Limiter</h1>
            <h2 id="output" class="popup__remaining">Time remaining: --:--:--</h2>

            <section class="panel">
                <button id="export-csv" class="button button--secondary" type="button">Export CSV</button>
            </section>

            <section class="panel">
                <h3 class="panel__title">Discard Time</h3>
                <input type="range" id="discard-slider" min="0" max="7" step="0.1" value="0" />
                <p id="discard-amount" class="panel__value">0.0 hours</p>
                <button id="discard-btn" class="button button--danger" type="button">Discard</button>
            </section>

            <section class="panel panel--inline">
                <label class="toggle" for="midday-restriction-toggle">
                    <input type="checkbox" id="midday-restriction-toggle" />
                    <span>Block videos before midday (12:00 PM)</span>
                </label>
            </section>

            <p class="muted">Graph: last 14 days</p>
            <canvas id="history-chart" width="300" height="120"></canvas>
        </main>
    </body>
</html>
